name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the APK as a release asset

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # FCM credentials are optional. With the secret set, push notifications
      # work. Without it, we strip googleServicesFile from app.json so the build
      # still produces a usable APK (push registration degrades to a no-op).
      - name: Configure FCM credentials
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > frontend/google-services.json
            echo "FCM: google-services.json written — push enabled"
          else
            node -e "
              const fs = require('fs');
              const p = 'frontend/app.json';
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              delete j.expo.android.googleServicesFile;
              fs.writeFileSync(p, JSON.stringify(j, null, 2));
            "
            echo "FCM: no GOOGLE_SERVICES_JSON secret — building without push"
          fi

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Verify native config
        run: |
          echo "=== network_security_config.xml ==="
          cat frontend/android/app/src/main/res/xml/network_security_config.xml 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "=== google-services.json (absent is OK — push just disabled) ==="
          [ -f frontend/android/app/google-services.json ] && echo "PRESENT" || echo "ABSENT"
          echo ""
          echo "=== API base URL baked into this build ==="
          cat shared/config.json
          echo ""
          echo "=== AndroidManifest.xml (application tag) ==="
          grep -A2 "<application" frontend/android/app/src/main/AndroidManifest.xml

      # Run 31885528037 died with "kspReleaseKotlin FAILED: OutOfMemoryError:
      # Metaspace" and then wedged for ~2h. The Expo template ships a small
      # metaspace cap, and these must be set in gradle.properties — passing
      # -Dorg.gradle.jvmargs on the CLI does not configure the daemon JVM.
      - name: Raise Gradle/Kotlin memory limits
        run: |
          cat >> frontend/android/gradle.properties <<'PROPS'

          # --- CI overrides (later keys win) ---
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=2g
          kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
          kotlin.compiler.execution.strategy=in-process
          org.gradle.parallel=false
          PROPS
          tail -8 frontend/android/gradle.properties

      - name: Build release APK
        working-directory: frontend/android
        #  --console=plain  rich console buffers output in CI and looks hung
        #  arm64-v8a only   one ABI instead of four; covers all modern phones
        #  -x lintVital*    release lint is slow and was also failing on memory
        timeout-minutes: 45
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            --console=plain \
            --no-daemon \
            --stacktrace \
            -PreactNativeArchitectures=arm64-v8a \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease

      - name: Locate APK
        id: apk
        run: |
          set -e
          APK=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -n "$APK" ] || { echo "No APK produced"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VolleyUp
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      # Direct-download link that works on a phone, no GitHub login needed
      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          cp "${{ steps.apk.outputs.path }}" "VolleyConnect-${TAG}.apk"
          gh release create "$TAG" "VolleyConnect-${TAG}.apk" \
            --title "VolleyConnect $TAG" \
            --notes "Automated build of \`${GITHUB_SHA:0:7}\`. API: $(python3 -c "import json;c=json.load(open('shared/config.json'))['server'];print(f\"{c['protocol']}://{c['host']}\")")"
